
name: DevOps Project Workflow

on:
  push:
    branches:
      - main
    paths:
      - 'index.html'
      - '.github/workflows/deploy.yml'

  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Get project code
        uses: actions/checkout@v4

      - name: Check website file
        run: |
          test -f index.html
          echo "Website file found!"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Deploy website to EC2 using SSM
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "${{ vars.EC2_INSTANCE_ID }}" \
            --document-name "AWS-RunShellScript" \
            --parameters 'commands=["set -e","sudo mkdir -p /var/backups/devops","if [ -f /var/www/html/index.html ]; then sudo cp /var/www/html/index.html /var/backups/devops/index.html.previous; fi","curl -fsSL https://raw.githubusercontent.com/meeranimbargidevops-25/Automated-AWS-Deployment/main/index.html -o /tmp/index.html","sudo install -o root -g root -m 644 /tmp/index.html /var/www/html/index.html","sudo systemctl reload apache2"]' \
            --query "Command.CommandId" \
            --output text)

          echo "Deployment command sent: $COMMAND_ID"

          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "${{ vars.EC2_INSTANCE_ID }}"

          echo "Website deployment completed successfully!"
